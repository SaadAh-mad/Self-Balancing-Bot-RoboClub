<!DOCTYPE HTML><html>
<head>
  <title>ESP Web Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/107/three.min.js"></script>
</head>
<body>
  <div class="topnav">
    <h1><i class="far fa-compass"></i> MPU6050 <i class="far fa-compass"></i></h1>
  </div>
  <div class="content">
    <div class="cards">
      <div class="card">
        <p class="card-title">GYROSCOPE</p>
        <p><span class="reading">X: <span id="gyroX"></span> rad</span></p>
        <p><span class="reading">Y: <span id="gyroY"></span> rad</span></p>
        <p><span class="reading">Z: <span id="gyroZ"></span> rad</span></p>
      </div>
      <div class="card">
        <p class="card-title">ACCELEROMETER</p>
        <p><span class="reading">X: <span id="accX"></span> ms<sup>2</sup></span></p>
        <p><span class="reading">Y: <span id="accY"></span> ms<sup>2</sup></span></p>
        <p><span class="reading">Z: <span id="accZ"></span> ms<sup>2</sup></span></p>
      </div>
    </div>
  </div>
  <h2>PID Tuning</h2>
    <label>Kp: <span id="kpVal">0</span></label><br>
    <input type="range" id="kp" min="0" max="50" step="0.1"><br><br>

    <label>Ki: <span id="kiVal">0</span></label><br>
    <input type="range" id="ki" min="0" max="5" step="0.01"><br><br>

    <label>Kd: <span id="kdVal">0</span></label><br>
    <input type="range" id="kd" min="0" max="5" step="0.01"><br><br>

    <h2>Speed</h2>

    <label>Target Velocity: <span id="speedVal">0</span></label><br>
    <input type="range" id="speed" min="-10" max="10" step="0.1">

<script src="script.js"></script>
</body>
</html>
